[project]
name = "agents-hub"
version = "0.1.0"
description = "Scheduled data agents that publish JSON for a static site"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8,<2",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
