# Reusable: run one agent, commit its local state, force-push its published output to
# a `data` branch as a single orphan commit, and optionally notify a site repo.
#
# `workflow_call` only — this is a library workflow, never triggered directly. An
# agent repo calls it from its own cron/dispatch workflow, e.g.:
#
#   name: Run macro agent
#   on:
#     schedule: [{cron: "0 14 * * 1-5"}]
#     workflow_dispatch:
#   jobs:
#     run:
#       permissions:
#         contents: write        # always: commits data/, pushes the data branch
#         issues: write          # only if the agent opens ops alerts or edits issues
#       uses: Kghaffari26/agents-core/.github/workflows/run-agent.yml@v0.3.1
#       with:
#         agent: macro
#         site_repo: Kghaffari26/agents-hub   # optional
#       secrets: inherit
#
# Permissions: this workflow declares none of its own, so its job runs with exactly
# the GITHUB_TOKEN permissions the calling job grants (a called workflow can never
# exceed its caller's grant, and GitHub refuses to start one whose jobs request more
# than that). The most any agent needs is:
#
#     contents: write, issues: write, pull-requests: read, checks: read
#
# Grant only what the agent uses, per calling job — `contents: write` is always
# required. A least-privilege caller can split read-only and apply runs into two
# jobs with different grants (e.g. `issues: read` vs `issues: write`), both calling
# this workflow. A caller that grants nothing gets the repo's default token
# permissions, which on new repos is read-only and makes the push steps fail.
#
# The agent step gets GITHUB_TOKEN (this run's token, with those permissions),
# APPLY_CHANGES ("true"/"false", from the `apply_changes` input), and whichever of
# the declared secrets below the caller passes (`secrets: inherit` passes all that
# are set). Any secret may be missing; this workflow never requires one.
#
# Before the agent runs, the existing `data` branch (if any) is restored into
# public-data/, so history/ accumulates across runs and ctx.previous_latest() and
# manifest-entry.json see the previous run. Since agents-core v0.3.0 the published
# tree also holds trace.json and trace.schema.json (see the README).
name: Run agent
on:
  workflow_call:
    inputs:
      agent:
        description: Registered agent name (agents_core.agents entry-point name)
        required: true
        type: string
      extra_args:
        description: >-
          Extra arguments appended to `agents-run <agent>`, e.g. --force-briefs.
          Split on whitespace; not evaluated by a shell.
        required: false
        type: string
        default: ""
      max_run_usd:
        description: Per-run LLM spend cap in USD (AGENTS_CORE_MAX_RUN_USD)
        required: false
        type: string
        default: "0.50"
      site_repo:
        description: "owner/repo to notify via repository_dispatch (skipped if unset)"
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.12"
      cache_path:
        description: Path to cache between runs via actions/cache (skipped if unset)
        required: false
        type: string
        default: ""
      apply_changes:
        description: >-
          Exported to the agent step as APPLY_CHANGES=true/false. Agent-specific: an
          agent that makes external changes can require it (as well as --apply).
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      FRED_API_KEY:
        required: false
      SAM_API_KEY:
        required: false
      CENSUS_API_KEY:
        required: false
      REPO_MAINT_TOKEN:
        required: false
      SITE_DISPATCH_TOKEN:
        required: false
concurrency:
  group: agents-data-push-${{ github.repository }}
  cancel-in-progress: false
env:
  AGENT: ${{ inputs.agent }}
  PUBLISH_DIR: public-data
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ inputs.python_version }}

      - uses: actions/cache@v4
        if: inputs.cache_path != ''
        with:
          path: ${{ inputs.cache_path }}
          key: ${{ github.repository }}-${{ inputs.agent }}-${{ github.run_id }}
          restore-keys: ${{ github.repository }}-${{ inputs.agent }}-

      # The data branch is the last published output; it wins over anything cached or
      # committed in public-data/.
      - name: Restore previous data branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --no-tags --depth=1 origin data
            mkdir -p "$PUBLISH_DIR"
            git archive FETCH_HEAD | tar -x -C "$PUBLISH_DIR"
            echo "restored $(find "$PUBLISH_DIR" -type f | wc -l) files from the data branch"
          else
            echo "no data branch yet; starting from an empty $PUBLISH_DIR"
          fi

      - run: uv sync

      - name: Run ${{ inputs.agent }}
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          REPO_MAINT_TOKEN: ${{ secrets.REPO_MAINT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          APPLY_CHANGES: ${{ inputs.apply_changes }}
          AGENTS_CORE_MAX_RUN_USD: ${{ inputs.max_run_usd }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          # shellcheck disable=SC2086 # EXTRA_ARGS is deliberately split on whitespace
          uv run agents-run "$AGENT" $EXTRA_ARGS

      # A failed run still updates manifest-entry.json (status: failed) and the cost
      # log, so commit either way. latest.json is never touched by a failed run.
      - name: Commit local run state
        id: commit_state
        env:
          OUTCOME: ${{ steps.agent.outcome }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "agents-core[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data/; fi
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data($AGENT): run $OUTCOME $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "$BRANCH" && \
                git push origin "HEAD:$BRANCH" && break
              sleep $((2 ** i))
            done
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Builds the commit from public-data/ alone, via a throwaway index, so nothing
      # else in the workspace (.venv, .cache, the default branch's files) can leak in.
      - name: Publish data branch
        if: hashFiles('public-data/**') != ''
        run: |
          set -euo pipefail
          git config user.name "agents-core[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_INDEX_FILE="$(mktemp -u)"
          export GIT_INDEX_FILE
          git --work-tree="$PUBLISH_DIR" add --all --force .
          tree="$(git write-tree)"
          rm -f "$GIT_INDEX_FILE"
          commit="$(git commit-tree "$tree" -m "data($AGENT): publish $(date -u +%Y-%m-%dT%H:%MZ)")"
          git push --force origin "$commit:refs/heads/data"

      - name: Notify site repo
        if: inputs.site_repo != ''
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE_REPO: ${{ inputs.site_repo }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "SITE_DISPATCH_TOKEN not set; skipping site notification"
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: token ${SITE_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SITE_REPO}/dispatches" \
            -d "$(jq -nc --arg agent "$AGENT" --arg repo "$REPOSITORY" \
                  '{event_type:"agent-data-updated", client_payload:{agent:$agent, repository:$repo}}')"

      - name: Fail if the agent run failed
        if: steps.agent.outcome == 'failure'
        run: exit 1
