[project]
name = "agents-core"
version = "0.1.0"
description = "Shared framework for scheduled data agents: HTTP caching, cost tracking, a number guard, tiered/cached Claude calls, publish + entry-point agent registration."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8,<2",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.scripts]
agents-run = "agents_core.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
