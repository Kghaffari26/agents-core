# Default model tiers and pricing, shipped with agents-core. An agent repo's own
# config/models.toml overrides these keys (a deep merge, not a replace) — it only
# needs to specify what it wants to change.
#
# VERIFY current model IDs, prices, and the batch discount rate at
# https://docs.claude.com before relying on this for real budget math.

[tiers.fast]
model = "claude-haiku-4-5-20251001"
max_tokens = 4096

[tiers.smart]
model = "claude-sonnet-5"
max_tokens = 8000
effort = "medium"

# USD per million tokens. cache_write is the 5-minute TTL rate.
[pricing]
batch_discount = 0.5

[pricing.models."claude-haiku-4-5-20251001"]
input = 1.00
output = 5.00
cache_write = 1.25
cache_read = 0.10

[pricing.models."claude-haiku-4-5"]
input = 1.00
output = 5.00
cache_write = 1.25
cache_read = 0.10

[pricing.models."claude-sonnet-5"]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.20

# Synchronous calls made together (LLM.run_many, guard_batch retries, a batch's
# on_timeout="sync" fallback) run on up to this many threads; 1 = sequential.
# A tier may also set `temperature` (omit it for models that reject sampling
# parameters, which is why none of the defaults above set one).
[llm]
max_concurrency = 1
